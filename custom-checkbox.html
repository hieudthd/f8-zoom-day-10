<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/custom-checkbox.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

    <title>#2. Custom checkbox</title>
</head>

<body>
    <div class="wrapper">
        <div class="check-box-wrapper">
            <label for="check-box" class="label">Checkbox</label>
            <input type="checkbox" name="" id="check-box">
            <label for="check-box" class="check-box">
                <i class="fa-solid fa-check"></i>
            </label>
        </div>
        <div class="radio-wrapper">
            <label for="radio" class="label">Radio</label>
            <input type="checkbox" name="" id="radio">
            <label for="radio" class="radio">
            </label>
        </div>
        <div class="switch-wrapper">
            <label for="switch" class="label">Switch</label>
            <input type="checkbox" name="" id="switch">
            <label for="switch" class="switch"></label>
        </div>
    </div>
</body>

</html>
